html{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--f);line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse 70% 45% at 50% -5%,rgba(232,81,13,.16),transparent 70%)}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--ac);color:#fff}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
header{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);background:rgba(14,13,18,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.bar{height:var(--nav);max-width:1280px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.02em}
.logo img{width:28px;height:28px;border-radius:8px}
.logo small{color:var(--mu);font-weight:600;font-size:14px}
.right{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:999px;border:1px solid var(--ac);background:var(--ac);color:#fff;font-weight:600;font-size:14.5px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(232,81,13,.4)}
.btn.ghost{background:transparent;border-color:var(--ln);color:var(--tx)}.btn.ghost:hover{border-color:var(--mu);box-shadow:none}
.btn.sm{padding:8px 14px;font-size:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
.user{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.user img{width:30px;height:30px;border-radius:50%;background:var(--s2)}
.av{display:inline-grid;place-items:center;background:var(--s2);color:var(--mu);font-weight:800;border-radius:50%;overflow:hidden;flex:none}
.av img{width:100%;height:100%}
main{max-width:1280px;margin:0 auto;padding:0 20px 80px}
.center{min-height:calc(100vh - var(--nav) - 40px);display:grid;place-items:center;text-align:center;padding:40px 0}
.center h1{font-size:clamp(32px,5vw,52px);letter-spacing:-.035em;line-height:1.05;margin:0 0 12px}
.center p{color:var(--mu);max-width:460px;margin:0 auto 26px}
.err{color:#ff8a80;margin-top:16px;font-size:14px}
h2.t{font-size:clamp(26px,3.4vw,36px);letter-spacing:-.03em;margin:44px 0 6px}
.lead{color:var(--mu);margin:0 0 28px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.sc{display:flex;align-items:center;gap:14px;padding:18px;border:1px solid var(--ln);border-radius:var(--r);background:var(--s1);transition:border-color .2s,transform .2s}
.sc:hover{border-color:var(--ac);transform:translateY(-3px)}
.sc .av{width:48px;height:48px;font-size:18px}
.sc b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
.sc span{font-size:13px;color:var(--mu)}
.sc .btn{margin-left:auto}
.dash{display:grid;grid-template-columns:270px 1fr;gap:34px;padding-top:26px}
.side{position:sticky;top:calc(var(--nav) + 20px);align-self:start;max-height:calc(100vh - var(--nav) - 40px);overflow:auto;padding-right:4px}
.gh{display:flex;align-items:center;gap:12px;padding:6px 6px 16px;border-bottom:1px solid var(--ln);margin-bottom:14px}
.gh .av{width:42px;height:42px}
.gh b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.gh a{font-size:12.5px;color:var(--mu)}.gh a:hover{color:var(--tx)}
.find{width:100%;padding:10px 14px;margin:0 0 6px;border:1px solid var(--ln);border-radius:999px;background:var(--s1);font-size:14px}
.gl{font-size:12px;color:var(--mu);font-weight:600;letter-spacing:.04em;margin:18px 10px 6px}
.side nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;font-size:14.5px;color:var(--mu);transition:background .15s,color .15s}
.side nav a:hover{background:var(--s1);color:var(--tx)}
.side nav a.on{background:rgba(232,81,13,.16);color:var(--tx)}
.dotk{width:7px;height:7px;border-radius:50%;background:var(--ln);flex:none}.dotk.on{background:var(--ok)}.dotk.none{background:transparent}
.content{min-width:0;max-width:860px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:34px}
.stat{padding:20px;border:1px solid var(--ln);border-radius:var(--r);background:var(--s1)}
.stat span{color:var(--mu);font-size:13.5px}.stat b{display:block;font-size:34px;letter-spacing:-.03em;margin-top:4px}
.gt{margin:30px 0 14px;font-size:13px;color:var(--mu);font-weight:600;letter-spacing:.04em}
.mods{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.mod{padding:18px 20px;border:1px solid var(--ln);border-radius:var(--r);background:var(--s1);transition:border-color .2s}
.mod:hover{border-color:var(--ac)}
.mod h3{margin:0 0 4px;font-size:17px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mod p{margin:0;color:var(--mu);font-size:14px}
.pill{font-size:11px;font-weight:700;letter-spacing:.05em;padding:2px 8px;border-radius:6px;background:var(--s2);color:var(--mu)}
.pill.on{background:rgba(59,165,93,.18);color:#6fd391}
.pill.pr{background:rgba(232,81,13,.18);color:var(--ac2);margin-left:8px;vertical-align:middle}
.form{display:grid;gap:22px;padding:26px;border:1px solid var(--ln);border-radius:var(--r);background:var(--s1)}
.sec{margin:6px 0 -6px;padding-top:18px;border-top:1px solid var(--ln);font-size:13px;color:var(--mu);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.sec:first-child{border-top:0;padding-top:0}
.fld{transition:opacity .2s}
.fld.off{opacity:.4;pointer-events:none}
.fld.lock{opacity:.55;pointer-events:none}
.fld label.l{display:block;font-weight:600;margin-bottom:8px;font-size:15px}
.fld .h{color:var(--mu);font-size:13px;margin-top:6px}
.fld input[type=text],.fld input[type=number],.fld select,.fld textarea{width:100%;padding:12px 14px;border:1px solid var(--ln);border-radius:12px;background:var(--bg)}
.fld input[type=color]{width:64px;height:42px;padding:3px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);cursor:pointer}
.fld textarea{min-height:110px;resize:vertical}
.fld select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;cursor:pointer}
.sw input{position:absolute;opacity:0}
.sw i{position:relative;width:46px;height:26px;border-radius:99px;background:var(--s2);border:1px solid var(--ln);flex:none;transition:background .2s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked+i{background:var(--ac);border-color:var(--ac)}
.sw input:checked+i::after{transform:translateX(20px)}
.sw input:focus-visible+i{outline:2px solid var(--ac2);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 12px;border-radius:999px;background:var(--s2);border:1px solid var(--ln);font-size:13.5px}
.chip button{display:grid;place-items:center;width:20px;height:20px;border:0;border-radius:50%;background:transparent;color:var(--mu);cursor:pointer;font-size:15px;line-height:1}
.chip button:hover{background:var(--ln);color:var(--tx)}
.rows{display:grid;gap:10px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr)) auto;gap:10px;align-items:end;padding:12px;border:1px solid var(--ln);border-radius:12px;background:var(--bg)}
.row select,.row input{padding:10px 12px!important}
.mini{display:block}.mini span{display:block;font-size:12px;color:var(--mu);margin-bottom:4px}
.rows>.btn{justify-self:start}
.save{position:sticky;bottom:18px;margin-top:20px;display:none;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px 12px 20px;border:1px solid var(--ln);border-radius:999px;background:rgba(30,28,38,.95);backdrop-filter:blur(10px);box-shadow:0 14px 40px rgba(0,0,0,.45)}
.save.show{display:flex}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;background:var(--s2);border:1px solid var(--ln);padding:12px 20px;border-radius:999px;font-size:14px;transition:.3s;z-index:40;pointer-events:none;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.bad{border-color:#ff6b5e}
.muted{color:var(--mu)}
@media(max-width:900px){
.dash{grid-template-columns:1fr;gap:18px}
.side{position:static;max-height:none}
.side nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}.side nav a{white-space:nowrap}.gl,.find{display:none}.ng{display:contents}
.mods{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr 1fr}.stat b{font-size:26px}
.logo small{display:none}
.form{padding:18px}
}

/* ---- Suivi : journal d'audit, transcripts, absences du staff ---- */
.side nav a .ic{display:inline-flex;align-items:center;gap:10px}
.side nav a .ic svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.side nav a.sv.on{background:rgba(232,81,13,.14);color:var(--ac2);box-shadow:inset 0 0 0 1px rgba(232,81,13,.45)}
.tb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.tb .find{width:auto;flex:1;min-width:180px;margin:0}
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.fchips button{border:1px solid var(--ln);background:var(--s1);color:var(--mu);padding:6px 13px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.fchips button:hover{color:var(--tx);border-color:var(--mu)}
.fchips button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.alog{display:grid;gap:8px}
.ae{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--ln);border-radius:12px;background:var(--s1);transition:border-color .2s}
.ae:hover{border-color:var(--mu)}
.ae .ai{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:17px}
.ae b{display:block;font-size:14.5px;overflow-wrap:anywhere}
.ae span.d{display:block;color:var(--mu);font-size:13px;overflow-wrap:anywhere}
.ae time{color:var(--mu);font-size:12.5px;white-space:nowrap;text-align:right}
.ae time em{display:block;font-style:normal;font-size:11.5px;opacity:.75}
.ae .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:1px 7px;border-radius:6px;margin-right:6px;background:var(--s2);color:var(--mu);vertical-align:1px}
.jrf{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;padding:14px;border:1px solid var(--ln);border-radius:14px;background:var(--s1);margin:0 0 16px}
.jrf input,.jrf select{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;font-size:14px}
.jrf .mini span{display:block;font-size:12px;font-weight:600;color:var(--mu);margin-bottom:4px}
.jrl{display:grid;gap:16px}
.jg{border:1px solid var(--ln);border-radius:14px;background:var(--s1);overflow:hidden}
.jgh{display:flex;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--ln);font-size:14px;color:var(--mu)}
.jgh b{color:var(--tx)}.jgh em{font-style:normal;font-size:12.5px}
.jr{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 18px;border-top:1px solid var(--ln)}
.jgb .jr:first-child{border-top:0}
.jr:hover{background:rgba(255,255,255,.025)}
.ji{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:18px;border:1px solid;flex:none}
.jd{font-size:14.5px;overflow-wrap:anywhere}.jd b{font-weight:700}
.jm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:12.5px;color:var(--mu)}
.jw{display:inline-flex;align-items:center;gap:6px}
.jw i{width:18px;height:18px;border-radius:50%;background:#3ba55d;color:#fff;font-style:normal;font-size:10px;font-weight:700;display:grid;place-items:center}
.jb{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:rgba(88,101,242,.2);color:#a5adff}
.jb.bot{background:rgba(59,165,93,.2);color:#6fd391}
.jch{display:inline-block;padding:1px 8px;border-radius:7px;background:var(--s2);font-weight:600;font-size:13px}
.jtm{text-align:right;font-size:12.5px;color:var(--mu);white-space:nowrap}.jtm b{display:block;color:var(--tx);font-size:13px}
.jov{position:fixed;inset:0;z-index:50;background:rgba(5,5,10,.72);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;overflow:auto}
.jmd{width:min(560px,100%);border:1px solid var(--ln);border-radius:18px;background:var(--bg);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.jh{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--ln)}
.jhx{flex:1;min-width:0}.jhx b{display:block;font-size:17px}.jhx span{font-size:13px;color:var(--mu)}
.jx{border:0;background:none;color:var(--mu);font-size:16px;cursor:pointer;padding:4px 8px}
.jbd{padding:6px 20px 8px}
.jl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;padding:10px 0;font-size:14px;align-items:start}
.jl>span{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);padding-top:2px}
.jl>div{overflow-wrap:anywhere}.jct{white-space:pre-wrap}
.jl code,.jtech code{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.jtech{border:1px solid var(--ln);border-radius:12px;background:var(--s1);margin:8px 0 12px;padding:0 14px}
.jtech summary{display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer;padding:12px 0;font-size:14px;font-weight:600}
.jtech summary code{color:var(--mu);font-weight:400}
.jtb{border-top:1px solid var(--ln);padding:4px 0 8px}.jtb .jl{grid-template-columns:130px minmax(0,1fr);padding:7px 0}
.jtb .jl>span{text-transform:none;letter-spacing:0;font-size:13px;font-weight:600}
.jf{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--ln)}
.jat{display:grid;gap:12px}.jai{display:grid;gap:6px}.jan{font-size:12.5px;color:var(--mu)}
.jimg{display:block;border:1px solid var(--ln);border-radius:12px;background:var(--s2);overflow:hidden;min-height:48px}
.jimg img{display:block;max-width:100%;max-height:320px;margin:0 auto;object-fit:contain}
.jimg.off{padding:14px;font-size:13px;color:var(--mu);text-align:center}
@media(max-width:700px){.jr{grid-template-columns:40px minmax(0,1fr)}.jtm{grid-column:2;text-align:left}.jr .btn{grid-column:2;justify-self:start}.jl{grid-template-columns:1fr;gap:2px}}
.live2{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--mu);cursor:pointer}
.live2 input{accent-color:var(--ac)}
.trl{display:grid;gap:8px}
.tr{display:flex;align-items:center;gap:14px;padding:13px 16px;border:1px solid var(--ln);border-radius:12px;background:var(--s1)}
.tr .ti{flex:1;min-width:0}.tr b{display:block;overflow-wrap:anywhere}.tr span.d{color:var(--mu);font-size:13px}
.abs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr)) auto;gap:10px;align-items:end;padding:14px;border:1px solid var(--ln);border-radius:12px;background:var(--s1);margin:0 0 18px}
.abs input,.abs select{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--bg)}
.abs .mini span{display:block;font-size:12px;color:var(--mu);margin-bottom:4px}
@media(max-width:600px){.ae{grid-template-columns:38px minmax(0,1fr)}.ae time{grid-column:2;text-align:left}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.pvbox{margin:14px 0 6px}.pv{display:block;max-width:100%;border-radius:14px;margin:0 0 10px}

.content.wide{max-width:none}
.pvsplit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:26px;align-items:start}
.pvmain{min-width:0}
.pvcol{position:sticky;top:calc(var(--nav) + 20px);padding:14px;border:1px solid var(--ln);border-radius:var(--r);background:var(--s1)}
.pvcol .pv{width:100%;margin:0 0 10px;background:var(--bg)}
.pvcol .btn{width:100%}
.live{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:12.5px;color:var(--mu)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 3px rgba(59,165,93,.2)}
.live.wait::before{background:var(--ac2);box-shadow:0 0 0 3px rgba(255,122,61,.2)}
.live.bad::before{background:#ff6b5e;box-shadow:0 0 0 3px rgba(255,107,94,.2)}
.pvmain>.pvbox:first-child{margin-top:0}
.act{margin:0 0 38px}
.ah{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.ah h3{margin:0;font-size:20px}
.seg{display:inline-flex;padding:3px;border:1px solid var(--ln);border-radius:999px;background:var(--s1)}
.seg button{border:0;background:transparent;color:var(--mu);padding:6px 14px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer;transition:background .15s,color .15s}
.seg button:hover{color:var(--tx)}.seg button.on{background:var(--ac);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 14px}
.kpi{padding:16px 18px;border:1px solid var(--ln);border-radius:var(--r);background:var(--s1);min-width:0}
.kpi span{display:block;color:var(--mu);font-size:13px}
.kpi b{display:block;font-size:26px;letter-spacing:-.03em;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi small{display:block;color:var(--mu);font-size:12.5px}
.cg{display:grid;gap:14px}
.cc{padding:18px 18px 12px;border:1px solid var(--ln);border-radius:var(--r);background:var(--s1);min-width:0}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 10px}
.ch b{font-size:15.5px}.ch small{color:var(--mu);font-size:12.5px}
.lg{display:flex;gap:14px;font-size:12.5px;color:var(--mu)}
.lg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.cw{position:relative}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .gr{stroke:var(--ln);stroke-width:1}
.chart .ax{fill:var(--mu);font-size:11px;font-family:var(--f)}
.chart .hit{fill:transparent}.chart .hit:hover{fill:rgba(255,255,255,.06)}
.tip{position:absolute;top:0;left:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .12s;background:var(--s2);border:1px solid var(--ln);border-radius:10px;padding:8px 11px;font-size:12.5px;line-height:1.45;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.tip.show{opacity:1}.tip b{display:block;margin-bottom:2px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.tl{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;margin:0 0 10px;font-size:13.5px}
.tr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tr em{font-style:normal;color:var(--mu);font-variant-numeric:tabular-nums}
.tr div{grid-column:1/-1;height:5px;border-radius:99px;background:var(--s2);overflow:hidden}.tr div i{display:block;height:100%;border-radius:99px;background:var(--ac)}
.arow{display:flex;align-items:flex-start;gap:14px;padding:13px 16px;margin:0 0 10px;border:1px solid var(--ln);border-radius:12px;background:var(--s1)}.arow .ati{flex:1;min-width:0}.arow .ati b{display:block;margin-bottom:4px;overflow-wrap:anywhere}.arow .ad{display:block;color:var(--mu);font-size:13px;overflow-wrap:anywhere;margin-top:2px}
.empty{padding:26px;border:1px dashed var(--ln);border-radius:var(--r);color:var(--mu);text-align:center;font-size:14.5px}
@media(max-width:900px){
.pvsplit{grid-template-columns:1fr;gap:16px}
.pvcol{order:-1;z-index:6;top:calc(var(--nav) + env(safe-area-inset-top,0px) + 6px);padding:10px;background:rgba(22,21,28,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pvcol .pv{max-height:30vh;width:auto;margin:0 auto 8px}
.pvcol .btn{display:none}
.kpis{grid-template-columns:1fr 1fr}.tl{grid-template-columns:1fr}
}

/* test anti-scam */
.as-ctl{border:1px solid var(--ln);border-radius:var(--r);background:var(--s1);padding:20px;display:flex;flex-direction:column;gap:14px;margin-bottom:18px}
.as-ctl small{color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.as-chips{display:flex;flex-wrap:wrap;gap:8px}
.as-chips button{border:1px solid var(--ln);border-radius:999px;background:var(--bg);font-size:13.5px;padding:8px 14px;cursor:pointer;transition:border-color .15s,background .15s}
.as-chips button:hover{border-color:var(--ac);background:rgba(232,81,13,.12)}
.as-form{display:flex;gap:10px}
.as-form input{flex:1;min-width:0;padding:12px 16px;border:1px solid var(--ln);border-radius:999px;background:var(--bg)}
.as-note{color:var(--mu);font-size:12.5px;margin:0}
.as-out{background:#313338;border-radius:12px;padding:16px;color:#dbdee1;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:220px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.as-out .as-ph{color:#949ba4;text-align:center;padding:70px 10px}
.as-row{display:flex;gap:12px}.as-row+.as-row{margin-top:14px}
.as-av{width:40px;height:40px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700;flex:none;overflow:hidden}
.as-av.u{background:#5865f2}.as-av img{width:100%;height:100%}
.as-nm{font-weight:600;color:#fff;transition:opacity .35s}
.as-tag{display:inline-block;background:#5865f2;color:#fff;font-size:10px;font-weight:600;padding:1px 5px;border-radius:4px;margin-left:6px;vertical-align:1px}
.as-ts{color:#949ba4;font-size:12px;margin-left:8px;font-weight:400}
.as-msg{margin:2px 0 0;overflow-wrap:anywhere;transition:opacity .35s}
.as-msg a{color:#00a8fc}
.as-ment{background:rgba(88,101,242,.3);color:#c9cdfb;border-radius:3px;padding:0 2px}
.as-gone{opacity:.45;text-decoration:line-through}
.as-emb{margin-top:8px;border-left:4px solid var(--ac);background:#2b2d31;border-radius:4px;padding:10px 14px;animation:asin .4s}
.as-emb.ok{border-left-color:#23a55a}.as-emb.wr{border-left-color:#f0b232}
.as-emb h4{margin:0 0 4px;font-size:15px;color:#fff}.as-emb p{margin:0;font-size:13.5px}
.as-flds{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px 14px;margin-top:10px}
.as-flds small{display:block;color:#b5bac1;font-size:11px;font-weight:700;text-transform:none;letter-spacing:0}
.as-flds b{color:#fff;font-size:13.5px;font-weight:600}
.as-sc{display:flex;justify-content:space-between;margin-top:12px;font-size:12.5px;color:#b5bac1}
.as-mt{height:8px;background:#1e1f22;border-radius:99px;overflow:hidden;margin:6px 0 4px}
.as-mt i{display:block;height:100%;width:0;border-radius:99px;transition:width 1.1s .1s cubic-bezier(.2,.8,.2,1)}
.as-hits{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.as-hits span{padding:5px 12px;border-radius:999px;font-size:12.5px;background:rgba(232,81,13,.14);border:1px solid rgba(232,81,13,.4);color:#fff}
.as-emb.ok .as-hits span{background:#1e1f22;border-color:#3a3c42;color:#b5bac1}
@keyframes asin{from{opacity:0;transform:translateY(6px)}}
@media(prefers-reduced-motion:reduce){.as-emb{animation:none}.as-mt i,.as-nm,.as-msg{transition:none}}

/* notifications */
.nfadd{margin-bottom:8px}
.nfaddrow{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr) minmax(120px,200px) auto;gap:10px;align-items:end}
.nfaddrow select,.nfaddrow input,.nf select{width:100%;padding:11px 14px;border:1px solid var(--ln);border-radius:12px;background:var(--bg)}
.nfaddrow select,.nf select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.nfl{display:grid;gap:12px}
.nf{padding:16px 18px;border:1px solid var(--ln);border-radius:var(--r);background:var(--s1);transition:border-color .2s,opacity .2s}
.nf.paused{opacity:.78}
.nfh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.nfn{font-size:16px;margin-right:10px;overflow-wrap:anywhere}
.nfsw{flex:none;cursor:pointer}
.nfr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nfsel{flex:1;min-width:180px}
.nfed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:22px;margin-top:16px;padding-top:18px;border-top:1px solid var(--ln);align-items:start}
.nfform{display:grid;gap:16px;min-width:0}
.nfform .fld input[type=text],.nfform .fld textarea,.nfform .fld select{width:100%}
.nfside{position:sticky;top:calc(var(--nav) + 20px)}
.nfpv{min-height:0;padding:14px}
.nfmsg{margin:0 0 6px}
.nfemb{margin-top:6px}
.nfimg{margin:10px 0 2px;height:130px;border-radius:6px;background:#1e1f22;color:#6d6f78;display:grid;place-items:center;font-size:12.5px}
.nffoot{margin-top:10px;font-size:12px;color:#b5bac1}
.nfbtn{display:inline-block;margin-top:10px;padding:7px 16px;border-radius:6px;background:#4e5058;color:#fff;font-size:13.5px;font-weight:600}
@media(max-width:900px){.nfaddrow{grid-template-columns:1fr}.nfed{grid-template-columns:1fr}.nfside{position:static;order:-1}}

<script>
/* ---- Réglages : adresse de l'API du bot ---- */
var API="https://corelab-bot.onrender.com/panel";
var CLIENT_ID="1403513450273177772";

var $=function(q,r){return (r||document).querySelector(q)};
var app=$("#app"),token=null,ME=null,META={},DIRTY=false;
try{token=localStorage.getItem("cl_dash")}catch(e){}

function h(tag,attrs,kids){var e=document.createElement(tag);
for(var k in (attrs||{})){var v=attrs[k];if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(k,v===true?"":v)}
[].concat(kids||[]).forEach(function(c){if(c==null)return;e.appendChild(typeof c==="string"?document.createTextNode(c):c)});return e}
function toast(msg,bad){var t=$("#toast");t.textContent=msg;t.className="toast show"+(bad?" bad":"");clearTimeout(toast.t);toast.t=setTimeout(function(){t.className="toast"},3600)}
function icon(id,hash,name,size){var s=size||48,w=h("span",{class:"av",style:"width:"+s+"px;height:"+s+"px"});
if(hash){w.appendChild(h("img",{src:"https://cdn.discordapp.com/icons/"+id+"/"+hash+".png?size=128",alt:""}))}else w.textContent=(name||"?").trim().charAt(0).toUpperCase();return w}
function api(path,opt){opt=opt||{};opt.headers=Object.assign({Authorization:"Bearer "+token},opt.headers||{});
return fetch(API+path,opt).then(function(r){if(r.status===401){logout(true);throw new Error("auth")}return r.json().then(function(j){if(!r.ok)throw j;return j})})}
function logout(silent){try{localStorage.removeItem("cl_dash")}catch(e){}
if(!silent&&token)fetch(API+"/api/logout",{method:"POST",headers:{Authorization:"Bearer "+token}}).catch(function(){});
token=null;ME=null;META={};location.hash="";render()}

/* ---- Jeton renvoyé par la connexion Discord ---- */
var hm=location.hash.match(/token=([\w.\-]+)/),he=location.hash.match(/error=(\w+)/),LOGIN_ERR=he?he[1]:"";
if(hm){token=hm[1];try{localStorage.setItem("cl_dash",token)}catch(e){}}
if(hm||he)history.replaceState(null,"",location.pathname);

/* ---- Navigation ---- */
function route(){var m=location.hash.match(/^#\/g\/(\d+)(?:\/(\w+))?/);return m?{g:m[1],m:m[2]||null}:{}}

var selP=h("select");NF_PF.forEach(function(p){selP.appendChild(opt(p[0],p[1]))});
var inUrl=h("input",{type:"text",maxlength:300}),selC=nfChannelSelect(meta,meta.channels[0]?meta.channels[0].id:"");
function ph(){inUrl.placeholder=NF_PF.filter(function(p){return p[0]===selP.value})[0][2]}selP.addEventListener("change",ph);ph();
var bAdd=h("button",{class:"btn sm",type:"button",text:"＋ Ajouter"});
function add(){var url=inUrl.value.trim();if(!url){toast("Indiquez le lien ou le pseudo.",true);return}if(!selC.value){toast("Choisissez un salon.",true);return}
bAdd.disabled=true;
nfPost(G,{action:"add",platform:selP.value,url:url,channelId:selC.value}).then(function(r){inUrl.value="";items=r.items;toast("Notification ajoutée ✓");draw()})
.catch(function(e){if(e&&e.message==="auth")return;toast(errText(e),true)}).then(function(){bAdd.disabled=false})}
bAdd.addEventListener("click",add);inUrl.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();add()}});
c.appendChild(h("div",{class:"form nfadd"},[h("div",{class:"sec",text:"Suivre une nouvelle chaîne"}),
h("div",{class:"nfaddrow"},[lab("Plateforme",selP),lab("Lien ou pseudo",inUrl),lab("Salon",selC),bAdd]),count]));
c.appendChild(listBox);
/* --- liste --- */
function save(it,body,okMsg){return nfPost(G,Object.assign({action:"update",id:it.id},body)).then(function(r){items=r.items;if(okMsg)toast(okMsg);draw()}).catch(function(e){if(e&&e.message==="auth")return;toast(errText(e),true);draw()})}
function card(it){var D=NF_DEF[it.platform],on=it.enabled,hasCustom=Object.keys(it.custom||{}).length>0;
var cb=h("input",{type:"checkbox"});cb.checked=on;
cb.addEventListener("change",function(){cb.disabled=true;save(it,{enabled:cb.checked},cb.checked?"Notification activée ✓":"Notification en pause ✓")});
var sel=nfChannelSelect(meta,it.channelId,function(){save(it,{channelId:sel.value},"Salon modifié ✓")});
var bEdit=h("button",{class:"btn ghost sm",type:"button",text:openId===it.id?"Fermer l’éditeur":"🎨 Personnaliser"+(hasCustom?" •":""),onclick:function(){if(DIRTY&&openId&&openId!==it.id&&!confirm("Quitter sans enregistrer ?"))return;DIRTY=false;openId=openId===it.id?null:it.id;draw()}});
var bDel=h("button",{class:"btn ghost sm",type:"button",text:"Retirer",onclick:function(){if(!confirm("Ne plus suivre « "+it.name+" » ?"))return;
nfPost(G,{action:"remove",id:it.id}).then(function(r){if(openId===it.id){openId=null;DIRTY=false}items=r.items;toast("Notification retirée ✓");draw()}).catch(function(e){if(e&&e.message==="auth")return;toast(errText(e),true)})}});
var el=h("div",{class:"nf"+(on?"":" paused")},[
h("div",{class:"nfh"},[h("div",{style:"min-width:0"},[h("b",{class:"nfn",text:it.name}),h("span",{class:"pill"+(on?" on":""),text:on?"ACTIF":"EN PAUSE"})]),h("label",{class:"sw nfsw","aria-label":"Activer ou mettre en pause"},[cb,h("i")])]),
h("div",{class:"nfr"},[h("div",{class:"fld nfsel"},[sel]),bEdit,bDel])]);
if(openId===it.id)el.appendChild(nfEditor(G,meta,it,function(next){if(next)items=next;else openId=null;draw()}));
return el}
function draw(){listBox.innerHTML="";
count.textContent=max!==null?items.length+" / "+max+" notification(s) suivie(s) sur ce serveur.":"";
if(!items.length){listBox.appendChild(h("div",{class:"empty",text:"Aucune notification suivie pour l’instant. Ajoutez une chaîne ci-dessus."}));return}
NF_PF.forEach(function(p){var list=items.filter(function(i){return i.platform===p[0]});if(!list.length)return;
listBox.appendChild(h("div",{class:"gt",text:p[1].toUpperCase()+" · "+list.length}));
listBox.appendChild(h("div",{class:"nfl"},list.map(card)))})}
listBox.appendChild(h("p",{class:"muted",text:"Chargement…"}));
api("/api/guilds/"+G.id+"/notifs").then(function(d){items=d.items;max=d.max;draw()}).catch(function(e){if(e&&e.message==="auth")return;listBox.innerHTML="";listBox.appendChild(h("p",{class:"err",text:"Impossible de charger les notifications."}))})}


function render(){renderHeader();
if(!token){viewLogin();return}
if(!ME){app.innerHTML="";app.appendChild(h("p",{class:"muted",style:"padding-top:40px",text:"Chargement…"}));
api("/api/me").then(function(m){ME=m;render()}).catch(function(e){if(!(e&&e.message==="auth")){token=null;viewLogin()}});return}
