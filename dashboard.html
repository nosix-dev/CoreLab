<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0d12">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<title>Dashboard · CoreLab</title>
<style>
:root{--bg:#0e0d12;--s1:#16151c;--s2:#1e1c26;--ln:#2b2934;--tx:#f4f2f7;--mu:#a09cad;--ac:#e8510d;--ac2:#ff7a3d;--ok:#3ba55d;--r:14px;--f:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--nav:60px}
*,*::before,*::after{box-sizing:border-box}
html{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--f);line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse 70% 45% at 50% -5%,rgba(232,81,13,.16),transparent 70%)}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--ac);color:#fff}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
header{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);background:rgba(14,13,18,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.bar{height:var(--nav);max-width:1280px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.02em}
.logo img{width:28px;height:28px;border-radius:8px}
.logo small{color:var(--mu);font-weight:600;font-size:14px}
.right{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:999px;border:1px solid var(--ac);background:var(--ac);color:#fff;font-weight:600;font-size:14.5px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(232,81,13,.4)}
.btn.ghost{background:transparent;border-color:var(--ln);color:var(--tx)}.btn.ghost:hover{border-color:var(--mu);box-shadow:none}
.btn.sm{padding:8px 14px;font-size:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
.user{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.user img{width:30px;height:30px;border-radius:50%;background:var(--s2)}
.av{display:inline-grid;place-items:center;background:var(--s2);color:var(--mu);font-weight:800;border-radius:50%;overflow:hidden;flex:none}
.av img{width:100%;height:100%}
main{max-width:1280px;margin:0 auto;padding:0 20px 80px}
.center{min-height:calc(100vh - var(--nav) - 40px);display:grid;place-items:center;text-align:center;padding:40px 0}
.center h1{font-size:clamp(32px,5vw,52px);letter-spacing:-.035em;line-height:1.05;margin:0 0 12px}
.center p{color:var(--mu);max-width:460px;margin:0 auto 26px}
.err{color:#ff8a80;margin-top:16px;font-size:14px}
h2.t{font-size:clamp(26px,3.4vw,36px);letter-spacing:-.03em;margin:44px 0 6px}
.lead{color:var(--mu);margin:0 0 28px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.sc{display:flex;align-items:center;gap:14px;padding:18px;border:1px solid var(--ln);border-radius:var(--r);background:var(--s1);transition:border-color .2s,transform .2s}
.sc:hover{border-color:var(--ac);transform:translateY(-3px)}
.sc .av{width:48px;height:48px;font-size:18px}
.sc b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
.sc span{font-size:13px;color:var(--mu)}
.sc .btn{margin-left:auto}
.dash{display:grid;grid-template-columns:270px 1fr;gap:34px;padding-top:26px}
.side{position:sticky;top:calc(var(--nav) + 20px);align-self:start;max-height:calc(100vh - var(--nav) - 40px);overflow:auto;padding-right:4px}
.gh{display:flex;align-items:center;gap:12px;padding:6px 6px 16px;border-bottom:1px solid var(--ln);margin-bottom:14px}
.gh .av{width:42px;height:42px}
.gh b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.gh a{font-size:12.5px;color:var(--mu)}.gh a:hover{color:var(--tx)}
.find{width:100%;padding:10px 14px;margin:0 0 6px;border:1px solid var(--ln);border-radius:999px;background:var(--s1);font-size:14px}
.gl{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;font:600 12px var(--f);color:var(--mu);letter-spacing:.04em;margin:14px 0 4px;padding:9px 10px;border-radius:9px;cursor:pointer;text-align:left;transition:background .15s,color .15s}
.gl:hover{background:var(--s1);color:var(--tx)}
.glt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.glc{flex:none;font-size:10.5px;font-weight:700;letter-spacing:0;padding:1px 7px;border-radius:999px;background:var(--s2);color:var(--mu)}
.gla{flex:none;font-size:11px;color:var(--mu);transition:transform .15s}
.ng.open .gla{transform:rotate(180deg)}
.ng .nl{display:none;flex-direction:column}
.ng.open .nl{display:flex}
.side nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;font-size:14.5px;color:var(--mu);transition:background .15s,color .15s}
.side nav a:hover{background:var(--s1);color:var(--tx)}
.side nav a.on{background:rgba(232,81,13,.16);color:var(--tx)}
.dotk{width:7px;height:7px;border-radius:50%;background:var(--ln);flex:none}.dotk.on{background:var(--ok)}.dotk.none{background:transparent}
.content{min-width:0;max-width:860px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:34px}
.stat{padding:20px;border:1px solid var(--ln);border-radius:var(--r);background:var(--s1)}
.stat span{color:var(--mu);font-size:13.5px}.stat b{display:block;font-size:34px;letter-spacing:-.03em;margin-top:4px}
.gt{margin:30px 0 14px;font-size:13px;color:var(--mu);font-weight:600;letter-spacing:.04em}
.mods{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.mod{padding:18px 20px;border:1px solid var(--ln);border-radius:var(--r);background:var(--s1);transition:border-color .2s}
.mod:hover{border-color:var(--ac)}
.mod h3{margin:0 0 4px;font-size:17px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mod p{margin:0;color:var(--mu);font-size:14px}
.pill{font-size:11px;font-weight:700;letter-spacing:.05em;padding:2px 8px;border-radius:6px;background:var(--s2);color:var(--mu)}
.pill.on{background:rgba(59,165,93,.18);color:#6fd391}
.pill.pr{background:rgba(232,81,13,.18);color:var(--ac2);margin-left:8px;vertical-align:middle}
.form{display:grid;gap:22px;padding:26px;border:1px solid var(--ln);border-radius:var(--r);background:var(--s1)}
.sec{margin:6px 0 -6px;padding-top:18px;border-top:1px solid var(--ln);font-size:13px;color:var(--mu);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.sec:first-child{border-top:0;padding-top:0}
.fld{transition:opacity .2s}
.fld.off{opacity:.4;pointer-events:none}
.fld.lock{opacity:.55;pointer-events:none}
.fld label.l{display:block;font-weight:600;margin-bottom:8px;font-size:15px}
.fld .h{color:var(--mu);font-size:13px;margin-top:6px}
.fld input[type=text],.fld input[type=number],.fld select,.fld textarea{width:100%;padding:12px 14px;border:1px solid var(--ln);border-radius:12px;background:var(--bg)}
.fld input[type=color]{width:64px;height:42px;padding:3px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);cursor:pointer}
.fld textarea{min-height:110px;resize:vertical}
.fld select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;cursor:pointer}
.sw input{position:absolute;opacity:0}
.sw i{position:relative;width:46px;height:26px;border-radius:99px;background:var(--s2);border:1px solid var(--ln);flex:none;transition:background .2s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked+i{background:var(--ac);border-color:var(--ac)}
.sw input:checked+i::after{transform:translateX(20px)}
.sw input:focus-visible+i{outline:2px solid var(--ac2);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 12px;border-radius:999px;background:var(--s2);border:1px solid var(--ln);font-size:13.5px}
.chip button{display:grid;place-items:center;width:20px;height:20px;border:0;border-radius:50%;background:transparent;color:var(--mu);cursor:pointer;font-size:15px;line-height:1}
.chip button:hover{background:var(--ln);color:var(--tx)}
.rows{display:grid;gap:10px}
.cmd-list{display:grid;gap:8px}
.cmd-item{display:flex;align-items:center;gap:14px;padding:13px 15px;border:1px solid var(--ln);border-radius:12px;background:var(--s1)}
.cmd-item.child{margin-left:18px}
.cmd-info{flex:1;min-width:0}
.cmd-name{display:block;font-weight:700;overflow-wrap:anywhere}
.cmd-desc{display:block;color:var(--mu);font-size:12.5px;margin-top:3px}
.cmd-kind{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--mu);text-transform:uppercase}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr)) auto;gap:10px;align-items:end;padding:12px;border:1px solid var(--ln);border-radius:12px;background:var(--bg)}
.row select,.row input{padding:10px 12px!important}
.mini{display:block}.mini span{display:block;font-size:12px;color:var(--mu);margin-bottom:4px}
.rows>.btn{justify-self:start}
.save{position:sticky;bottom:18px;margin-top:20px;display:none;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px 12px 20px;border:1px solid var(--ln);border-radius:999px;background:rgba(30,28,38,.95);backdrop-filter:blur(10px);box-shadow:0 14px 40px rgba(0,0,0,.45)}
.save.show{display:flex}
.gsave{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:40;width:min(780px,calc(100% - 32px));display:none;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px 12px 22px;border:1px solid var(--ac);border-radius:999px;background:rgba(30,28,38,.96);backdrop-filter:blur(10px);box-shadow:0 14px 40px rgba(0,0,0,.55)}
.gsave.show{display:flex}
.gtx{min-width:0;display:flex;flex-direction:column}.gtx b{font-size:14px}.gtx em{font-style:normal;font-size:12.5px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gbt{display:flex;gap:8px;flex:none}
@media(max-width:600px){.gsave{border-radius:18px;flex-direction:column;align-items:stretch;padding:12px 14px}.gbt{justify-content:flex-end}}
.cmd-save-dock{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:39;display:none;justify-content:center;pointer-events:none}
.cmd-save-dock.show{display:flex}.cmd-save-dock .btn{pointer-events:auto;box-shadow:0 12px 36px rgba(0,0,0,.5)}
@media(max-width:600px){.cmd-save-dock{bottom:12px;width:calc(100% - 24px)}.cmd-save-dock .btn{width:100%}}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;background:var(--s2);border:1px solid var(--ln);padding:12px 20px;border-radius:999px;font-size:14px;transition:.3s;z-index:40;pointer-events:none;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.bad{border-color:#ff6b5e}
.muted{color:var(--mu)}
@media(max-width:900px){
.dash{grid-template-columns:1fr;gap:18px}
.side{position:static;max-height:none}
.side nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}.side nav a{white-space:nowrap}.gl,.find{display:none}.ng{display:contents}.ng .nl{display:contents}
.mods{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr 1fr}.stat b{font-size:26px}
.logo small{display:none}
.form{padding:18px}
}

/* ---- Suivi : journal d'audit, transcripts, absences du staff ---- */

/* ---- Calendrier des absences (mois / semaine / jour) ---- */
.cal-tabs{display:flex;gap:8px;margin:0 0 14px}
.cal-tb{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.cal-nav{display:flex;gap:6px}
.cal-t{font-size:20px;flex:1;min-width:160px}
.cal-vs{display:inline-flex;border:1px solid var(--ln);border-radius:999px;overflow:hidden}
.cal-vs button{border:0;background:var(--s1);color:var(--mu);padding:8px 16px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s}
.cal-vs button:hover{color:var(--tx)}
.cal-vs button.on{background:var(--ac);color:#fff}
.cal-lgs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.cal-lg{--c:#8a8696;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--ln);background:var(--s1);color:var(--tx);padding:5px 12px;border-radius:999px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s}
.cal-lg i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.cal-lg em{font-style:normal;color:var(--mu);font-weight:500}
.cal-lg.off{opacity:.45;text-decoration:line-through}
.cal-sc{overflow-x:auto;border:1px solid var(--ln);border-radius:14px;background:var(--s1)}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-width:680px}
.cal-h{padding:9px 10px;font-size:12px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--ln);border-right:1px solid var(--ln)}
.cal-h.today{color:var(--ac2)}
.cal-c{min-height:104px;padding:6px;border-right:1px solid var(--ln);border-bottom:1px solid var(--ln);display:flex;flex-direction:column;gap:4px;min-width:0}
.cal-c.wk{min-height:260px}
.cal-g>*:nth-child(7n){border-right:0}
.cal-c.out{background:rgba(0,0,0,.2)}
.cal-c.out .cal-n{opacity:.45}
.cal-c.today{box-shadow:inset 0 0 0 2px var(--ac)}
.cal-n{align-self:flex-start;border:0;background:none;color:var(--tx);font:inherit;font-size:13px;font-weight:700;min-width:26px;height:26px;border-radius:13px;cursor:pointer}
.cal-n:hover{background:var(--s2)}
.cal-c.today .cal-n{background:var(--ac);color:#fff}
.cv{--c:#8a8696;display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:0;border-left:3px solid var(--c);background:var(--s2);color:var(--tx);padding:3px 7px;border-radius:6px;font:inherit;font-size:12px;cursor:pointer;min-width:0}
.cv:hover{filter:brightness(1.25)}
.cv span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv em{font-style:normal;color:var(--mu);font-size:11px;margin-left:auto;white-space:nowrap;padding-left:4px}
.cv.pending{border-left-style:dashed}
.cv.active{box-shadow:inset 0 0 0 1px var(--c)}
.cv.past,.cv.returned{opacity:.7}
.cv.cancelled,.cv.refused{opacity:.55;text-decoration:line-through}
.cal-more{border:0;background:none;color:var(--mu);font:inherit;font-size:11.5px;font-weight:600;text-align:left;padding:1px 4px;cursor:pointer}
.cal-more:hover{color:var(--tx)}
.cal-dh{display:flex;align-items:center;gap:10px;margin:0 0 12px;color:var(--mu);font-size:13.5px}
@media(max-width:700px){.cal-c{min-height:84px}.cal-t{font-size:17px}.cal-vs button{padding:7px 12px}}
.side nav a .ic{display:inline-flex;align-items:center;gap:10px}
.side nav a .ic svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.side nav a.sv.on{background:rgba(232,81,13,.14);color:var(--ac2);box-shadow:inset 0 0 0 1px rgba(232,81,13,.45)}
.tb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.tb .find{width:auto;flex:1;min-width:180px;margin:0}
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.fchips button{border:1px solid var(--ln);background:var(--s1);color:var(--mu);padding:6px 13px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.fchips button:hover{color:var(--tx);border-color:var(--mu)}
.fchips button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.alog{display:grid;gap:8px}
.ae{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--ln);border-radius:12px;background:var(--s1);transition:border-color .2s}
.ae:hover{border-color:var(--mu)}
.ae .ai{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:17px}
.ae b{display:block;font-size:14.5px;overflow-wrap:anywhere}
.ae span.d{display:block;color:var(--mu);font-size:13px;overflow-wrap:anywhere}
.ae time{color:var(--mu);font-size:12.5px;white-space:nowrap;text-align:right}
.ae time em{display:block;font-style:normal;font-size:11.5px;opacity:.75}
.ae .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:1px 7px;border-radius:6px;margin-right:6px;background:var(--s2);color:var(--mu);vertical-align:1px}
.jrf{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;padding:14px;border:1px solid var(--ln);border-radius:14px;background:var(--s1);margin:0 0 16px}
.jrf input,.jrf select{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;font-size:14px}
.jrf .mini span{display:block;font-size:12px;font-weight:600;color:var(--mu);margin-bottom:4px}
.jrl{display:grid;gap:16px}
.jg{border:1px solid var(--ln);border-radius:14px;background:var(--s1);overflow:hidden}
.jgh{display:flex;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--ln);font-size:14px;color:var(--mu)}
.jgh b{color:var(--tx)}.jgh em{font-style:normal;font-size:12.5px}
.jr{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 18px;border-top:1px solid var(--ln)}
.jgb .jr:first-child{border-top:0}
.jr:hover{background:rgba(255,255,255,.025)}
.ji{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:18px;border:1px solid;flex:none}
.jd{font-size:14.5px;overflow-wrap:anywhere}.jd b{font-weight:700}
.jm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:12.5px;color:var(--mu)}
.jw{display:inline-flex;align-items:center;gap:6px}
.jw i{width:18px;height:18px;border-radius:50%;background:#3ba55d;color:#fff;font-style:normal;font-size:10px;font-weight:700;display:grid;place-items:center}
.jb{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:rgba(88,101,242,.2);color:#a5adff}
.jb.bot{background:rgba(59,165,93,.2);color:#6fd391}
.jch{display:inline-block;padding:1px 8px;border-radius:7px;background:var(--s2);font-weight:600;font-size:13px}
.jtm{text-align:right;font-size:12.5px;color:var(--mu);white-space:nowrap}.jtm b{display:block;color:var(--tx);font-size:13px}
.jov{position:fixed;inset:0;z-index:50;background:rgba(5,5,10,.72);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;overflow:auto}
.jmd{width:min(560px,100%);border:1px solid var(--ln);border-radius:18px;background:var(--bg);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.jh{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--ln)}
.jhx{flex:1;min-width:0}.jhx b{display:block;font-size:17px}.jhx span{font-size:13px;color:var(--mu)}
.jx{border:0;background:none;color:var(--mu);font-size:16px;cursor:pointer;padding:4px 8px}

var r=token&&ME?route():{},g=r.g,n=g&&PEND[g]?Object.keys(PEND[g]).length:0;
gbar.className="gsave"+(n?" show":"");gbar.innerHTML="";if(!n)return;
var labels=Object.keys(PEND[g]).map(function(k){return PEND[g][k].label});
gbar.appendChild(h("span",{class:"gtx"},[h("b",{text:n+(n>1?" modules modifiés":" module modifié")}),h("em",{text:labels.join(" · ")})]));

h("button",{class:"btn sm",type:"button",text:gbusy?"Enregistrement…":"Tout enregistrer",disabled:gbusy,onclick:function(){saveAll(g)}})]))}
function saveAll(g){if(gbusy)return;var ids=Object.keys(PEND[g]||{}),fails=[],ok=0;gbusy=true;updateGBar();
(function next(i){if(i>=ids.length)return done();var mid=ids[i],it=PEND[g][mid];
api("/api/guilds/"+g+"/modules/"+mid,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(it.body)})
.then(function(){ok++;delete PEND[g][mid];next(i+1)})
.catch(function(e){if(e&&e.message==="auth"){gbusy=false;return}fails.push(it.label+" : "+errText(e));next(i+1)})})(0);
