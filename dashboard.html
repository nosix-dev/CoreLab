<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060b10">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<title>Dashboard · CoreLab</title>
<style>
:root{--bg:#0f1319;--s1:#16151c;--s2:#1e1c26;--ln:#2b2934;--tx:#f4f2f7;--mu:#a09cad;--ac:#00e5ff;--ac2:#5ef2ff;--ok:#3ba55d;--r:14px;--f:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--nav:60px}
*,*::before,*::after{box-sizing:border-box}
html{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--f);line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse 70% 45% at 50% -5%,rgba(0,229,255,.16),transparent 70%)}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--ac);color:#fff}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
header{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);background:rgba(14,13,18,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.bar{height:var(--nav);max-width:1280px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.02em}
.logo img{width:28px;height:28px;border-radius:8px}
.logo small{color:var(--mu);font-weight:600;font-size:14px}
.right{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:999px;border:1px solid var(--ac);background:var(--ac);color:#fff;font-weight:600;font-size:14.5px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,229,255,.4)}
.btn.ghost{background:transparent;border-color:var(--ln);color:var(--tx)}.btn.ghost:hover{border-color:var(--mu);box-shadow:none}
.btn.sm{padding:8px 14px;font-size:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
.user{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.user img{width:30px;height:30px;border-radius:50%;background:var(--s2)}
.av{display:inline-grid;place-items:center;background:var(--s2);color:var(--mu);font-weight:800;border-radius:50%;overflow:hidden;flex:none}
.av img{width:100%;height:100%}
main{max-width:1280px;margin:0 auto;padding:0 20px 80px}
.center{min-height:calc(100vh - var(--nav) - 40px);display:grid;place-items:center;text-align:center;padding:40px 0}
.center h1{font-size:clamp(32px,5vw,52px);letter-spacing:-.035em;line-height:1.05;margin:0 0 12px}
.center p{color:var(--mu);max-width:460px;margin:0 auto 26px}
.err{color:#ff8a80;margin-top:16px;font-size:14px}
h2.t{font-size:clamp(26px,3.4vw,36px);letter-spacing:-.03em;margin:44px 0 6px}
.lead{color:var(--mu);margin:0 0 28px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.sc{display:flex;align-items:center;gap:14px;padding:18px;border:1px solid var(--ln);border-radius:var(--r);background:var(--s1);transition:border-color .2s,transform .2s}
.sc:hover{border-color:var(--ac);transform:translateY(-3px)}
.sc .av{width:48px;height:48px;font-size:18px}
.sc b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
.sc span{font-size:13px;color:var(--mu)}
.sc .btn{margin-left:auto}
.dash{display:grid;grid-template-columns:270px 1fr;gap:34px;padding-top:26px}
.side{position:sticky;top:calc(var(--nav) + 20px);align-self:start;max-height:calc(100vh - var(--nav) - 40px);overflow:auto;padding-right:4px}
.gh{display:flex;align-items:center;gap:12px;padding:6px 6px 16px;border-bottom:1px solid var(--ln);margin-bottom:14px}
.gh .av{width:42px;height:42px}
.gh b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.gh a{font-size:12.5px;color:var(--mu)}.gh a:hover{color:var(--tx)}
.find{width:100%;padding:10px 14px;margin:0 0 6px;border:1px solid var(--ln);border-radius:999px;background:var(--s1);font-size:14px}
.gl{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;font:600 12px var(--f);color:var(--mu);letter-spacing:.04em;margin:14px 0 4px;padding:9px 10px;border-radius:9px;cursor:pointer;text-align:left;transition:background .15s,color .15s}
.gl:hover{background:var(--s1);color:var(--tx)}
.glt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.glc{flex:none;font-size:10.5px;font-weight:700;letter-spacing:0;padding:1px 7px;border-radius:999px;background:var(--s2);color:var(--mu)}
.gla{flex:none;font-size:11px;color:var(--mu);transition:transform .15s}
.ng.open .gla{transform:rotate(180deg)}
.ng .nl{display:none;flex-direction:column}
.ng.open .nl{display:flex}
.side nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;font-size:14.5px;color:var(--mu);transition:background .15s,color .15s}
.side nav a:hover{background:var(--s1);color:var(--tx)}
.side nav a.on{background:rgba(0,229,255,.16);color:var(--tx)}
.dotk{width:7px;height:7px;border-radius:50%;background:var(--ln);flex:none}.dotk.on{background:var(--ok)}.dotk.none{background:transparent}
.content{min-width:0;max-width:860px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:34px}
.stat{padding:20px;border:1px solid var(--ln);border-radius:var(--r);background:var(--s1)}
.stat span{color:var(--mu);font-size:13.5px}.stat b{display:block;font-size:34px;letter-spacing:-.03em;margin-top:4px}
.gt{margin:30px 0 14px;font-size:13px;color:var(--mu);font-weight:600;letter-spacing:.04em}
.mods{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.mod{padding:18px 20px;border:1px solid var(--ln);border-radius:var(--r);background:var(--s1);transition:border-color .2s}
.mod:hover{border-color:var(--ac)}
.mod h3{margin:0 0 4px;font-size:17px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mod p{margin:0;color:var(--mu);font-size:14px}
.pill{font-size:11px;font-weight:700;letter-spacing:.05em;padding:2px 8px;border-radius:6px;background:var(--s2);color:var(--mu)}
.pill.on{background:rgba(59,165,93,.18);color:#6fd391}
.pill.pr{background:rgba(0,229,255,.18);color:var(--ac2);margin-left:8px;vertical-align:middle}
.form{display:grid;gap:22px;padding:26px;border:1px solid var(--ln);border-radius:var(--r);background:var(--s1)}
.sec{margin:6px 0 -6px;padding-top:18px;border-top:1px solid var(--ln);font-size:13px;color:var(--mu);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.sec:first-child{border-top:0;padding-top:0}
.fld{transition:opacity .2s}
.fld.off{opacity:.4;pointer-events:none}
.fld.lock{opacity:.55;pointer-events:none}
.fld label.l{display:block;font-weight:600;margin-bottom:8px;font-size:15px}
.fld .h{color:var(--mu);font-size:13px;margin-top:6px}
.fld input[type=text],.fld input[type=number],.fld select,.fld textarea{width:100%;padding:12px 14px;border:1px solid var(--ln);border-radius:12px;background:var(--bg)}
.fld input[type=color]{width:64px;height:42px;padding:3px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);cursor:pointer}
.fld textarea{min-height:110px;resize:vertical}
.fld select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;cursor:pointer}
.sw input{position:absolute;opacity:0}
.sw i{position:relative;width:46px;height:26px;border-radius:99px;background:var(--s2);border:1px solid var(--ln);flex:none;transition:background .2s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked+i{background:var(--ac);border-color:var(--ac)}
.sw input:checked+i::after{transform:translateX(20px)}
.sw input:focus-visible+i{outline:2px solid var(--ac2);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 12px;border-radius:999px;background:var(--s2);border:1px solid var(--ln);font-size:13.5px}
.chip button{display:grid;place-items:center;width:20px;height:20px;border:0;border-radius:50%;background:transparent;color:var(--mu);cursor:pointer;font-size:15px;line-height:1}
.chip button:hover{background:var(--ln);color:var(--tx)}
.rows{display:grid;gap:10px}
.cmd-list{display:grid;gap:8px}
.cmd-item{display:flex;align-items:center;gap:14px;padding:13px 15px;border:1px solid var(--ln);border-radius:12px;background:var(--s1)}
.cmd-item.child{margin-left:18px}
.cmd-info{flex:1;min-width:0}
.cmd-name{display:block;font-weight:700;overflow-wrap:anywhere}
.cmd-desc{display:block;color:var(--mu);font-size:12.5px;margin-top:3px}
.cmd-kind{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--mu);text-transform:uppercase}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr)) auto;gap:10px;align-items:end;padding:12px;border:1px solid var(--ln);border-radius:12px;background:var(--bg)}
.row select,.row input{padding:10px 12px!important}
.mini{display:block}.mini span{display:block;font-size:12px;color:var(--mu);margin-bottom:4px}
.rows>.btn{justify-self:start}
.fld input[type=time]{width:100%;padding:12px 14px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;color-scheme:dark}
.nm-card{margin-top:16px}.nm-card:first-child{margin-top:0}
.nm-title{margin:0;font-size:16px;font-weight:700}
.nm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.days{display:flex;gap:8px;flex-wrap:wrap}
.days button{width:36px;height:36px;border-radius:9px;border:1px solid var(--ln);background:var(--bg);color:var(--mu);font:inherit;font-weight:700;cursor:pointer;transition:background .15s,border-color .15s}
.days button.on{background:rgba(0,229,255,.16);border-color:var(--ac);color:var(--tx)}
.nm-sched .days button{width:32px;height:32px;font-size:13px}
.nm-sched .mini .days{margin-top:2px}
.net-ico{display:grid;place-items:center;width:52px;height:52px;margin:0 0 18px;border:1px solid var(--ln);border-radius:14px;background:var(--s1);color:var(--tx)}
.net-ico svg,.net-st svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.net-ico svg{width:24px;height:24px}
.net-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:0 0 16px}
.net-st{padding:18px 20px;border:1px solid var(--ln);border-radius:var(--r);background:var(--s1)}
.net-st .k{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:13.5px;font-weight:600}
.net-st .k svg{width:15px;height:15px}
.net-st .v{margin:6px 0 2px;font-size:30px;font-weight:800;line-height:1.1}
.net-st .s{color:var(--mu);font-size:13px}
.net-card .fld+.fld{padding-top:20px;border-top:1px solid var(--ln)}
.net-card .fld .h{max-width:640px}
.perms{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px 24px}
.pk{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14.5px}
.pk input{width:18px;height:18px;accent-color:var(--ac);cursor:pointer}
.pseg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:4px;border:1px solid var(--ln);border-radius:12px;background:var(--bg)}
.pseg button{padding:8px 14px;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--mu);font:inherit;font-size:14px;cursor:pointer}
.pseg button.on{background:rgba(0,229,255,.16);border-color:var(--ac);color:var(--tx);font-weight:600}
.nm-add{display:flex;gap:8px;align-items:center}.nm-add input{flex:1;min-width:0}.nm-add .mp{flex:1;min-width:0}
.mp{position:relative;min-width:0}.mp input{width:100%}
.mp.ok input{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset}
.mp-dd{position:absolute;left:0;top:calc(100% + 6px);z-index:60;width:100%;min-width:min(320px,86vw);max-height:280px;overflow-y:auto;overscroll-behavior:contain;padding:6px;border:1px solid var(--ln);border-radius:14px;background:var(--s2);box-shadow:0 18px 40px rgba(0,0,0,.55)}
.mp-dd[hidden]{display:none}
.mp-it{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px;cursor:pointer}
.mp-it.on{background:var(--s1);box-shadow:0 0 0 1px var(--ln) inset}
.mp-it img,.mp-av{width:28px;height:28px;border-radius:50%;flex:none;object-fit:cover}
.mp-av{display:grid;place-items:center;background:var(--ac);color:#fff;font-weight:700;font-size:13px}
.mp-tx{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.25}
.mp-tx b{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-tx small{font-size:12px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-it em{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:6px;background:var(--ac);color:#fff}
.mp-msg{padding:10px;font-size:13px;color:var(--mu)}
.qk-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 0}
.qk{padding:4px 11px;border-radius:999px;border:1px solid var(--ln);background:var(--s2);color:var(--mu);font-size:12.5px;cursor:pointer}
.qk:hover{color:var(--tx);border-color:var(--ac)}
.qk-l{font-size:12.5px;color:var(--mu)}
.qk-row input[type=search]{flex:1;min-width:150px;padding:8px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--tx);font-size:13.5px}
.selt input[type=search]{width:100%;padding:9px 12px;margin:0 0 6px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--tx);font-size:13.5px}
.selt .qk-row{margin:0 0 6px}

.fld .h.sub{margin:-2px 0 12px}
.nm-sub{margin:-8px 0 0;color:var(--mu);font-size:13.5px}
.net-lbl{margin:26px 0 10px;color:var(--mu);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.net-alerts{display:grid;gap:8px}
.net-al{padding:13px 16px;border:1px solid var(--ln);border-radius:12px;background:var(--s1);font-size:14px}
.net-al small{display:block;margin-top:2px;color:var(--mu);font-size:12.5px}
.td-stats{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.td-card{margin:0 0 16px;padding:18px 20px;border:1px solid var(--ln);border-radius:var(--r);background:var(--s1)}
.td-hd{display:flex;align-items:center;gap:14px}
.td-hd .in{flex:1;min-width:0}.td-hd .in b{display:block}.td-hd .in .d{display:block;color:var(--mu);font-size:13.5px;margin-top:2px}
.td-ic{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--ln);border-radius:11px;background:var(--bg);flex:none}
.td-ic svg,.td-chev svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.td-sep{margin:16px 0;border:0;border-top:1px solid var(--ln)}
.td-sel{max-width:340px}
.td-empty{margin:14px 0 2px;color:var(--mu);font-size:14px}
.td-chev{display:grid;place-items:center;width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:var(--mu);cursor:pointer;transition:transform .2s}
.td-chev.open{transform:rotate(180deg)}
.td-cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:16px;padding-top:16px;border-top:1px solid var(--ln)}
.td-h3{margin:22px 0 2px;font-size:16px;font-weight:700}
.rtabs{display:flex;gap:28px;margin:24px 0 22px;border-bottom:1px solid var(--ln);overflow-x:auto}
.rtabs button{flex:none;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:12px 0;color:var(--mu);font:inherit;font-weight:600;cursor:pointer;transition:color .15s}
.rtabs button:hover{color:var(--tx)}.rtabs button.on{color:var(--tx);border-bottom-color:var(--tx)}
.rp-sel{max-width:none;margin:0 0 12px}
.rp-hd{display:flex;align-items:center;gap:12px;width:100%;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.rp-hd .in{flex:1;min-width:0}.rp-hd .in b{display:block}.rp-hd .in .d{display:block;color:var(--mu);font-size:13.5px;margin-top:2px}
.rp-av{width:36px;height:36px;border-radius:50%;flex:none;object-fit:cover;background:var(--s2);display:grid;place-items:center;font-weight:700}
.rp-body{display:flex;flex-direction:column;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--ln)}
.rp-bulk{display:flex;gap:8px;flex-wrap:wrap}
.rp-note{margin:12px 0 0;color:var(--mu);font-size:13.5px}
.rp-row{margin:2px 0}
.pill.bad{background:rgba(237,66,69,.18);color:#f27b7d}
.stabs{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 0;padding-bottom:22px;border-bottom:1px solid var(--ln)}
.stabs button{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border:1px solid var(--ln);border-radius:10px;background:var(--s1);color:var(--mu);font:inherit;font-weight:600;font-size:14px;cursor:pointer;transition:.15s}
.stabs button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stabs button:hover{color:var(--tx)}.stabs button.on{color:var(--tx);border-color:var(--tx);background:var(--s2)}
.sv-form{display:grid;grid-template-columns:minmax(200px,1fr) minmax(220px,1.6fr) auto;gap:12px;align-items:end}
.sv-form input{width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;font-size:14px}
@media(max-width:700px){.sv-form{grid-template-columns:1fr}}
.sv-empty{text-align:center;padding:34px 20px}.sv-empty .td-ic{margin:0 auto}.sv-empty b{display:block;font-size:17px;margin:12px 0 4px}.sv-empty p{margin:0;color:var(--mu);font-size:14px}
.sv-act{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--mu)}
.sv-act time{margin-left:8px;opacity:.75}
.sv-link{color:var(--tx);font-weight:600;text-decoration:none;white-space:nowrap}
.inf-lbl{margin:26px 0 8px;font-size:13.5px;font-weight:700}
.inf-bar{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}
.inf-bar .fld{min-width:240px}
.inf-wrap{margin:22px 0 0;overflow-x:auto;border:1px solid var(--ln);border-radius:var(--r);background:var(--s1)}
.inf-t{width:100%;min-width:760px;border-collapse:collapse;font-size:14px}
.inf-t th{padding:16px 20px;text-align:left;border-bottom:1px solid var(--ln);color:var(--mu);font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.inf-t td{padding:14px 20px;border-bottom:1px solid var(--ln);vertical-align:middle}
.inf-t tr:last-child td{border-bottom:0}
.inf-t .id{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--mu)}
.inf-t .rs{max-width:320px;overflow-wrap:anywhere}
.inf-t .dt{white-space:nowrap;color:var(--mu)}

/* ---- Barre « Enregistrer » globale : garde les modifications de tous les modules et les enregistre d’un coup ---- */
function anyPend(){return Object.keys(PEND).some(function(g){return Object.keys(PEND[g]).length>0})}
var gbar=null,gbusy=false;
function updateGBar(){
if(!gbar){gbar=h("div",{class:"gsave",role:"region","aria-label":"Enregistrer les modifications"});document.body.appendChild(gbar)}
var r=token&&ME?route():{},g=r.g,n=g&&PEND[g]?Object.keys(PEND[g]).length:0;
gbar.className="gsave"+(n?" show":"");gbar.innerHTML="";if(!n)return;
var labels=Object.keys(PEND[g]).map(function(k){return PEND[g][k].label});
gbar.appendChild(h("span",{class:"gtx"},[h("b",{text:n+(n>1?" modules modifiés":" module modifié")}),h("em",{text:labels.join(" · ")})]));
gbar.appendChild(h("div",{class:"gbt"},[
h("button",{class:"btn ghost sm",type:"button",text:"Tout annuler",disabled:gbusy,onclick:function(){if(!confirm("Annuler toutes les modifications non enregistrées ?"))return;delete PEND[g];updateGBar();render()}}),
h("button",{class:"btn sm",type:"button",text:gbusy?"Enregistrement…":"Tout enregistrer",disabled:gbusy,onclick:function(){saveAll(g)}})]))}
function saveAll(g){if(gbusy)return;var ids=Object.keys(PEND[g]||{}),fails=[],ok=0;gbusy=true;updateGBar();
(function next(i){if(i>=ids.length)return done();var mid=ids[i],it=PEND[g][mid];
api("/api/guilds/"+g+"/modules/"+mid,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(it.body)})
.then(function(r){if(mid==="automod"&&!(r&&r.values&&Array.isArray(r.values.automod_rules))){fails.push(it.label+" : le bot n’a pas conservé ces réglages (route automod à ajouter côté bot)");return next(i+1)}ok++;delete PEND[g][mid];next(i+1)})
.catch(function(e){if(e&&e.message==="auth"){gbusy=false;return}fails.push(it.label+" : "+errText(e));next(i+1)})})(0);
function done(){gbusy=false;if(!fails.length){DIRTY=false;toast(ok>1?"Tout est enregistré ✓ ("+ok+" modules)":"Enregistré ✓")}else toast((ok?ok+" enregistré(s). ":"")+"Échec — "+fails.join(" | "),true);updateGBar()}}
