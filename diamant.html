<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0d12">
  <meta name="color-scheme" content="dark">
  <title>Diamant — CoreLab</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0e0d12;--s1:#16151c;--ln:#2b2934;--tx:#f4f2f7;--mu:#a09cad;--ac:#e8510d;--ac2:#ff7a3d}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse 70% 50% at 50% -5%,rgba(232,81,13,.16),transparent 70%),var(--bg);color:var(--tx);font-family:"Bricolage Grotesque",system-ui,sans-serif}
    a{color:inherit;text-decoration:none}
    header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100vw - 1120px)/2));border-bottom:1px solid var(--ln);background:rgba(14,13,18,.78);backdrop-filter:blur(14px)}
    .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}.logo img{width:30px;height:30px;border-radius:8px}
    .back{color:var(--mu);font-size:14px}
    main{max-width:1120px;margin:auto;padding:72px 22px 100px}
    .head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:38px}
    h1{margin:0;font-size:clamp(38px,7vw,66px);line-height:1;letter-spacing:-.04em}
    .lead{max-width:520px;margin:10px 0 0;color:var(--mu)}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 20px;border:1px solid var(--ac);border-radius:999px;background:var(--ac);color:#fff;font-weight:800}
    .btn.ghost{background:transparent;border-color:var(--ln)}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
    .board,.mine{border:1px solid var(--ln);border-radius:18px;background:rgba(22,21,28,.96)}
    .board h2,.mine h2{margin:0;padding:18px 20px;border-bottom:1px solid var(--ln);font-size:18px}
    .rows{display:grid}.row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:13px 20px;border-bottom:1px solid var(--ln)}
    .row:last-child{border-bottom:0}.rank{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--s1);color:var(--mu);font-weight:800}
    .row.top .rank{background:var(--ac);color:#fff}.name{font-weight:800}.meta{margin-top:2px;color:var(--mu);font-size:12.5px}
    .score{text-align:right}.score b{display:block}.score span{color:var(--mu);font-size:12.5px}
    .mine{position:sticky;top:82px;padding:18px}.gem{width:100%;aspect-ratio:1;border-radius:18px;background:#313338;display:grid;place-items:center;border:1px solid var(--ln)}
    .gem svg{width:72%;height:72%;filter:drop-shadow(0 12px 24px rgba(113,185,255,.24))}
    .mine p{color:var(--mu);font-size:13.5px}.mine .btn{width:100%;margin-top:10px}
    .status{padding:20px;color:var(--mu)}.error{color:#ff8a80}
    @media(max-width:850px){.layout{grid-template-columns:1fr}.mine{position:static}.head{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <header>
    <a class="logo" href="index.html"><img src="logo.png" alt="" width="30" height="30">CoreLab</a>
    <a class="back" href="index.html">‹ Retour au site</a>
  </header>
  <main>
    <div class="head">
      <div>
        <h1>💎 Diamant</h1>
        <p class="lead">Le classement mondial des mascottes Diamant de CoreLab.</p>
      </div>
      <a class="btn ghost" href="dashboard.html">Ouvrir mon diamant</a>
    </div>
    <div class="layout">
      <section class="board">
        <h2>🏆 Classement</h2>
        <div id="rows" class="rows"><div class="status">Chargement du classement…</div></div>
      </section>
      <aside class="mine">
        <h2 style="padding:0 0 12px;border:0">Ma mascotte</h2>
        <div class="gem" id="gemPreview">
          <svg viewBox="0 0 220 220" aria-hidden="true"><rect width="220" height="220" rx="36" fill="#16151c"/><path d="m110 24 64 67-64 105-64-105z" fill="#71b9ff" stroke="#dff7ff" stroke-width="7"/><path d="m46 91 64 105 64-105M110 24v172" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="4"/></svg>
        </div>
        <p>Créée avec <strong>/diamant mascotte creer</strong> sur Discord. La mascotte suit ton compte sur tous les serveurs.</p>
        <a class="btn" href="dashboard.html">Voir dans mon dashboard</a>
      </aside>
    </div>
  </main>
  <script>
    var API="https://corelab-bot.onrender.com/diamants";
    function esc(v){var d=document.createElement("div");d.textContent=String(v||"");return d.innerHTML}
    fetch(API,{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(data){
      var rows=document.getElementById("rows"),list=data.ranking||[];
      rows.innerHTML="";
      if(!list.length){rows.innerHTML='<div class="status">Aucune mascotte créée pour le moment.</div>';return}
      list.forEach(function(item){
        var row=document.createElement("div");row.className="row"+(item.rank<=3?" top":"");
        row.innerHTML='<div class="rank">'+item.rank+'</div><div><div class="name">'+esc(item.diamant)+' <span style="color:var(--mu)">• '+esc(item.name)+'</span></div><div class="meta">'+esc(item.stage)+' · Niveau '+item.level+' · '+esc(item.temperament)+' · Humeur '+item.mood+'%</div></div><div class="score"><b>'+item.gems.toLocaleString("fr-FR")+' gemmes</b><span>'+item.xp.toLocaleString("fr-FR")+" XP"+'</span></div>';
        rows.appendChild(row);
      });
    }).catch(function(){document.getElementById("rows").innerHTML='<div class="status error">Impossible de charger le classement.</div>'});
  </script>
</body>
</html>
